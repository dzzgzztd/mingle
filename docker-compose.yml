services:
  postgres:
    image: postgres:16
    container_name: mingle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    container_name: mingle_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      recommendation:
        condition: service_started
    environment:
      PORT: ${BACKEND_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE}
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      RECOMMENDATION_URL: ${RECOMMENDATION_URL}
      OMDB_API_KEY: ${OMDB_API_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      TGDB_API_KEY: ${TGDB_API_KEY}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./backend/seed:/app/seed

  recommendation:
    build: ./recommendation_service
    container_name: mingle_recommendation
    restart: unless-stopped
    ports:
      - "${RECOMMENDATION_PORT}:8000"

  frontend:
    build: ./frontend
    container_name: mingle_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:5173"

  redis:
    image: redis:7-alpine
    container_name: mingle_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data: